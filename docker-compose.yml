# fnmusic-ext v2.0.0：三音源 + WebUI 合并为单容器 fnmusic-sources（supervisor 按需加载）。
# 音源三选一：FNMUSIC_MUSICDL_ENABLED / FNMUSIC_NETEASE_ENABLED / FNMUSIC_LX_ENABLED
# 只写一个 true；entrypoint.sh 按 /repo/.env 只启动所选音源进程，未启用的不驻留内存。
# 运行期切源在 WebUI（8774）内完成：写 .env + 同容器 supervisorctl stop/start，秒级生效。
#
# 基础镜像 / pip / apt 源可由根目录 .env 覆盖（FNMUSIC_BASE_IMAGE / FNMUSIC_PIP_INDEX /
# FNMUSIC_APT_MIRROR），其中基础镜像由 ensure_base_image.sh 自动探测维护：
# 国内镜像优先直连（绕开 daemon 加速器），官方源兜底（不修改系统 Docker 配置，仅本应用构建生效）。
#
# 数据卷 ./sources-data:/data：网易登录态（XDG 目录）+ 洛雪源脚本缓存与 state.json。
# 升级自 v1.x（musicbox-data 目录）：首次安装时 install.sh 自动迁移为 sources-data。
# 仓库目录挂到 /repo：entrypoint / healthcheck 读 .env，WebUI 写 .env。
# --no-webui 仍挂此卷（否则按需启动读不到开关）；不挂 docker.sock。
services:
  fnmusic-sources:
    build:
      context: .
      dockerfile: container/Dockerfile
      network: host
      args:
        BASE_IMAGE: ${FNMUSIC_BASE_IMAGE:-python:3.13-slim}
        PIP_INDEX_URL: ${FNMUSIC_PIP_INDEX:-https://mirrors.tencent.com/pypi/simple/}
        APT_MIRROR: ${FNMUSIC_APT_MIRROR:-https://mirrors.tencent.com}
    # 默认本地构建并打此 tag。CI 已发布预构建镜像（.github/workflows/image.yml）：
    #   docker pull ghcr.io/liwenwen777/fnmusic-sources:latest
    #   docker tag  ghcr.io/liwenwen777/fnmusic-sources:latest fnmusic-sources:latest
    #   docker compose up -d        # 本地已有同名镜像即不再构建
    # 不直接把 image 指向 ghcr.io：GHCR 包默认私有，直连会在未登录的 NAS 上拉取失败。
    image: fnmusic-sources:latest
    container_name: fnmusic-sources
    ports:
      - "127.0.0.1:8768:8001"  # musicdl（代理访问）
      - "127.0.0.1:8770:8002"  # musicbox（仅本机；扫码走已登录的 WebUI）
      - "127.0.0.1:8772:8003"  # lxmusic（代理访问）
      - "127.0.0.1:8774:8004"  # WebUI（仅本机；浏览器走飞牛网关）
    volumes:
      - ./sources-data:/data
      - .:/repo
      - ./webui-service:/srv/webui-service
      - ./lxmusic-service:/srv/lxmusic-service
      - ./musicdl-service:/srv/musicdl-service
      - ./musicbox-service:/srv/musicbox-service
      - ./proxy:/srv/proxy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    # 资源与日志上限：容器内跑野生洛雪脚本 + ffmpeg + 抓取日志，默认 json-file
    # 无上限，异常脚本刷日志会把 NAS 系统盘写满（表现为「NAS 突然只读」）。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # 常驻 100-200MB；1g 留给 ffmpeg 转码/无损校验的瞬态峰值。
    mem_limit: 1g
    memswap_limit: 1g
    # 防止脚本 fork 风暴拖垮宿主机调度。
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    # 容器内只跑 python/node/supervisor，不需要任何 Linux capability。
    cap_drop:
      - ALL
